name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyquestblue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Publish release candidate
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Verify clean TestPyPI installation
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv /tmp/pyquestblue-testpypi
          for attempt in {1..10}; do
            if /tmp/pyquestblue-testpypi/bin/python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "pyquestblue==$version"; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then exit 1; fi
            sleep 15
          done
          /tmp/pyquestblue-testpypi/bin/python -c \
            "import questblue; assert questblue.__version__ == '$version'"
