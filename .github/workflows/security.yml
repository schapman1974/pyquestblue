name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install . pip-audit
      - name: Audit installed runtime dependencies
        run: python -m pip_audit --local --strict

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  security-success:
    name: Security success
    if: always()
    needs: [dependency-audit, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all security jobs passed
        run: >-
          test '${{ needs.dependency-audit.result }}' = 'success' &&
          test '${{ needs.codeql.result }}' = 'success'
