name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyquestblue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
      - name: Verify clean PyPI installation
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv /tmp/pyquestblue-pypi
          for attempt in {1..10}; do
            if /tmp/pyquestblue-pypi/bin/python -m pip install "pyquestblue==$version"; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then exit 1; fi
            sleep 15
          done
          /tmp/pyquestblue-pypi/bin/python -c \
            "import questblue; assert questblue.__version__ == '$version'"
