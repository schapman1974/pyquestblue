name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/check_contract_fixtures.py
      - run: python scripts/check_white_label_matrix.py
      - run: python scripts/check_docs.py
      - run: python scripts/api_coverage.py --check
      - run: python scripts/simple_coverage.py --check
      - run: mkdocs build --strict
      - run: pytest
      - run: python -m build
      - run: python scripts/check_reproducible_build.py
      - run: twine check dist/*

  ci-success:
    name: CI success
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs passed
        run: test '${{ needs.test.result }}' = 'success'
