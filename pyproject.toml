[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pyquestblue"
version = "0.1.0"
description = "A modern Python SDK for the QuestBlue telecommunications API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Stephen Chapman" }]
keywords = ["questblue", "voip", "sip", "sms", "fax", "telecommunications"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
django = ["django>=4.2,<5.2"]
fastapi = ["fastapi>=0.115,<1"]
dev = [
  "build>=1.2",
  "mike>=2.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "twine>=5.1",
]

[project.urls]
Documentation = "https://github.com/schapman1974/pyquestblue#readme"
Issues = "https://github.com/schapman1974/pyquestblue/issues"
Repository = "https://github.com/schapman1974/pyquestblue"

[tool.hatch.build.targets.wheel]
packages = ["src/questblue"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=questblue --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "recorded: deterministic tests using sanitized offline contract fixtures",
  "live: opt-in tests that can contact a real provider account",
  "live_read_only: production reads against a dedicated subaccount",
  "live_reversible: production writes that capture and restore prior state",
  "live_billable: explicitly acknowledged operations that may create charges",
  "live_compliance_sensitive: regulated registration or portability operations",
  "live_destructive: operations that delete or replace production state",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/questblue", "scripts", "examples"]
