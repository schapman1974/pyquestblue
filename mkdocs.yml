site_name: pyquestblue
site_description: Typed sync and async Python SDK for the QuestBlue telecommunications API
site_url: https://schapman1974.github.io/pyquestblue/
repo_url: https://github.com/schapman1974/pyquestblue
repo_name: schapman1974/pyquestblue
strict: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - mike:
      alias_type: symlink
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Guides:
      - Transport and retries: transport.md
      - Models and pagination: modeling.md
      - Contract testing: contract-testing.md
      - Framework recipes: framework-recipes.md
      - Webhooks and integrations: integrations.md
      - Migration guides: migrations.md
      - Compatibility and releases: compatibility.md
      - White-label architecture:
          - Capability gaps: white-label.md
          - Follow-on backlog: white-label-backlog.md
          - ADR 0001 — Tenant isolation: adr/0001-tenant-isolation.md
  - Resources:
      - Account: account.md
      - Voice DIDs: dids.md
      - International DIDs: international-dids.md
      - SIP trunks: sip-trunks.md
      - SMS and MMS: sms.md
      - 10DLC: dlc.md
      - Fax.Pro: fax.md
      - iFax Enterprise: enterprise-fax.md
      - Reports: reports.md
      - Number portability: lnp.md
      - VoIP servers: servers.md
  - API reference: api-reference.md
